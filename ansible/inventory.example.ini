# Copy to inventory.ini (ignored by git) and list your machines.
# The FreeBSD box pushes to everything over ssh; it can also manage itself.

[fedora]
laptop.lan

[freebsd]
server.lan  ansible_python_interpreter=/usr/local/bin/python3  ansible_become_method=doas

[macos]
macbook.lan

[noroot]
# machines without root: dotfiles and home-directory tools only
work.example.com  dotfiles_root=false

[local]
localhost  ansible_connection=local
